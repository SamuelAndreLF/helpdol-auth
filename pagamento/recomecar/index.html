<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelpDol</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#0D0D0D; color:#ECECEC; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:420px; background:#1C1C1C; border:1px solid #343434; border-radius:20px; padding:32px 24px; text-align:center; }
  .logo { width:64px; height:64px; border-radius:18px; margin:0 auto 18px; background:#2A2A2A; border:1px solid #343434;
    display:flex; align-items:center; justify-content:center; font-size:30px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:#9B9B9B; font-size:15px; line-height:1.5; margin:0 0 24px; }
  a.btn { display:block; border-radius:14px; padding:16px; font-size:16px; font-weight:600; text-decoration:none;
    background:#ECECEC; color:#0D0D0D; }
</style>
</head>
<body>
  <!-- Para onde a Stripe manda quando o link do cadastro venceu (refresh_url do helpdol-pay-account). Tambem nao existia e dava 404. -->
  <div class="card">
    <div class="logo">⏳</div>
    <h1 id="ttl"></h1>
    <p id="sub"></p>
    <a class="btn" id="voltar" href="logify://pagamento"></a>
  </div>
<script>
  var L = {"pt": {"ttl": "O link do cadastro venceu", "sub": "Isso é normal quando passa um tempo. Volte ao HelpDol e toque de novo em \"Receber no cartão\" para continuar de onde parou.", "btn": "Voltar para o HelpDol"}, "en": {"ttl": "The setup link expired", "sub": "That is normal after a while. Go back to HelpDol and tap \"Take card payments\" again to continue where you left off.", "btn": "Back to HelpDol"}, "es": {"ttl": "El enlace del registro venció", "sub": "Es normal cuando pasa un tiempo. Vuelve a HelpDol y toca de nuevo \"Cobrar con tarjeta\" para seguir donde quedaste.", "btn": "Volver a HelpDol"}};
  var lang = (new URLSearchParams(location.search).get('lang') || navigator.language || 'pt').slice(0,2).toLowerCase();
  var t = L[lang] || L.pt;
  document.documentElement.lang = L[lang] ? lang : 'pt';
  document.getElementById('ttl').textContent = t.ttl;
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('voltar').textContent = t.btn;
  setTimeout(function(){ location.href = 'logify://pagamento'; }, 1500);
</script>
</body>
</html>
